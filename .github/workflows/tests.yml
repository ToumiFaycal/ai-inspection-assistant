# Runs the automated tests on GitHub's servers after every push and every pull request.
# Results appear in the repository's "Actions" tab, and as a green tick or red cross next to each commit.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest  # a fresh Linux machine, rented by GitHub for each run
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip  # keep downloaded packages between runs, so later runs start faster
          cache-dependency-path: requirements-ci.txt

      - name: Install the test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run the tests
        run: python -m pytest -v
